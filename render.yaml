services:
  # 1. FastAPI Backend
  - type: web
    name: civic-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FRONTEND_URL
        value: https://civic-frontend.onrender.com

  # 2. React Frontend
  - type: web
    name: civic-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: VITE_API_URL
        value: https://civic-backend-qjm5.onrender.com/api

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
