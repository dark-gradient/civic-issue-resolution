services:
  # 1. FastAPI Backend
  - type: web
    name: civic-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      # You can add your MongoDB URL here or in the Render Dashboard
      # - key: MONGODB_URL
      #   sync: false

  # 2. React Frontend
  - type: web
    name: civic-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: VITE_API_URL
        value: https://civic-backend.onrender.com/api # You may need to update this to match the actual generated backend URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
